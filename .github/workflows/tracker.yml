name: Hourly Ticket Tracker

on:
  schedule:
    - cron: '0 * * * *' # Runs every single hour
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas matplotlib requests beautifulsoup4

      - name: Run script
        run: python update_tracker.py

      - name: Commit and push changes back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dolphins_chiefs_section_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ticket prices" && git push)
